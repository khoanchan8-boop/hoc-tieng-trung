<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Học tiếng Trung A1</title>
<style>
:root{--red:#c0392b;--red2:#e74c3c;--bg:#faf7f5;--card:#fff;--ink:#222;--mute:#888;--ok:#1e8449;--okbg:#e8f6ee;--bad:#c0392b;--badbg:#fdecea;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header h1{font-size:18px;margin:0;color:var(--red)}
.who{font-size:13px;color:var(--mute)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:var(--red);color:#fff;margin:8px 0;cursor:pointer;font-family:inherit}
.btn.sec{background:#fff;color:var(--red);border:2px solid var(--red)}
.btn.ghost{background:transparent;color:var(--mute);font-weight:500;font-size:15px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}.row .btn{flex:1}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:10px 0}
.big{font-size:84px;font-weight:700;text-align:center;line-height:1.15;margin:10px 0}
.mid{font-size:44px;font-weight:700;text-align:center}
.py{color:var(--red);font-size:22px;text-align:center}
.vn{font-size:20px;font-weight:600;text-align:center}
.ex{font-size:19px;text-align:center;margin-top:10px}
.exs{font-size:14px;color:var(--mute);text-align:center}
.hint{color:var(--mute);font-size:14px;text-align:center}
.seg{display:flex;background:#eee;border-radius:10px;padding:3px;margin:6px 0 10px}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:8px;font-size:14px;font-family:inherit;color:#555}
.seg button.on{background:#fff;color:var(--red);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{border:2px solid #e3dcd8;background:#fff;border-radius:12px;padding:14px;font-size:19px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.zh{font-size:30px;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;padding:8px;border-radius:12px}
.ans{border:2px dashed #ddd;background:#fff;margin-bottom:10px}
.tile{border:0;background:#fff3f1;border:2px solid #f0c4be;border-radius:10px;padding:8px 12px;font-size:26px;font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
.ans .tile{background:#fff;border-color:var(--red)}
.fb{padding:10px;border-radius:10px;text-align:center;margin-top:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.tbar i{background:#e67e22;transition:width 1s linear}
.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}
.flip{min-height:320px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
input.code{width:100%;font-size:24px;text-align:center;padding:12px;border:2px solid #ddd;border-radius:12px;letter-spacing:2px;text-transform:uppercase;font-family:inherit}
.err{color:var(--bad);text-align:center;font-size:14px;min-height:20px}
.res h2{text-align:center;margin:4px 0;color:var(--red)}
.score{font-size:64px;font-weight:800;text-align:center;color:var(--red);line-height:1}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:12px}
.meta b{color:#555;font-weight:600}
table.wr{width:100%;border-collapse:collapse;margin-top:6px}
table.wr td{border-bottom:1px solid #eee;padding:6px 4px;font-size:15px}
table.wr td.c{font-size:22px;font-weight:700;white-space:nowrap}
.spk{border:0;background:#fff3f1;color:var(--red);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;margin:6px auto 0;display:block}
.name{font-size:22px}
.pill{display:inline-block;background:#fff3f1;color:var(--red);border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

 "Có, mình có hai người bạn Đài Loan."], ["B", "我沒有台灣朋友。", "Wǒ méiyǒu Táiwān péngyou.", "Mình không có bạn Đài Loan."]], "5": [["A", "這是誰？", "Zhè shì shéi?", "Đây là ai?"], ["B", "這是我的媽媽。", "Zhè shì wǒ de māma.", "Đây là mẹ mình."], ["A", "那是你的哥哥嗎？", "Nà shì nǐ de gēge ma?", "Kia là anh trai bạn à?"], ["B", "不是，那是我的弟弟。", "Bú shì, nà shì wǒ de dìdi.", "Không phải, kia là em trai mình."], ["A", "你有姐姐嗎？", "Nǐ yǒu jiějie ma?", "Bạn có chị gái không?"], ["B", "沒有。我有一個妹妹。", "Méiyǒu. Wǒ yǒu yí ge mèimei.", "Không có. Mình có một em gái."]], "6": [["A", "你喜歡玩什麼？", "Nǐ xǐhuan wán shénme?", "Bạn thích chơi gì?"], ["B", "我喜歡打球。你呢？", "Wǒ xǐhuan dǎ qiú. Nǐ ne?", "Mình thích chơi bóng. Còn bạn?"], ["A", "我喜歡玩遊戲。", "Wǒ xǐhuan wán yóuxì.", "Mình thích chơi trò chơi."], ["B", "你喜歡看書嗎？", "Nǐ xǐhuan kàn shū ma?", "Bạn có thích đọc sách không?"], ["A", "不喜歡。我喜歡聽音樂。", "Bù xǐhuan. Wǒ xǐhuan tīng yīnyuè.", "Không thích. Mình thích nghe nhạc."], ["B", "我也喜歡聽音樂，也喜歡看電視。", "Wǒ yě xǐhuan tīng yīnyuè, yě xǐhuan kàn diànshì.", "Mình cũng thích nghe nhạc, cũng thích xem tivi."]], "7": [["A", "你想吃什麼？", "Nǐ xiǎng chī shénme?", "Bạn muốn ăn gì?"], ["B", "我想吃麵包。你呢？", "Wǒ xiǎng chī miànbāo. Nǐ ne?", "Mình muốn ăn bánh mì. Còn bạn?"], ["A", "我要吃飯。", "Wǒ yào chī fàn.", "Mình muốn ăn cơm."], ["B", "你想喝什麼？", "Nǐ xiǎng hē shénme?", "Bạn muốn uống gì?"], ["A", "我想喝牛奶。你要喝茶嗎？", "Wǒ xiǎng hē niúnǎi. Nǐ yào hē chá ma?", "Mình muốn uống sữa. Bạn muốn uống trà không?"], ["B", "不要，我喝水。麵包很好吃！", "Bú yào, wǒ hē shuǐ. Miànbāo hěn hǎochī!", "Không, mình uống nước. Bánh mì ngon lắm!"]], "8": [["A", "你會說中文嗎？", "Nǐ huì shuō Zhōngwén ma?", "Bạn biết nói tiếng Trung không?"], ["B", "會，我會說一點中文。", "Huì, wǒ huì shuō yìdiǎn Zhōngwén.", "Biết, mình biết nói một chút tiếng Trung."], ["A", "你會寫中文字嗎？", "Nǐ huì xiě Zhōngwén zì ma?", "Bạn biết viết chữ Hán không?"], ["B", "我會寫一點。你呢？", "Wǒ huì xiě yìdiǎn. Nǐ ne?", "Mình biết viết một chút. Còn bạn?"], ["A", "我不會寫。我會說英文。", "Wǒ bú huì xiě. Wǒ huì shuō Yīngwén.", "Mình không biết viết. Mình biết nói tiếng Anh."], ["B", "我們都學中文！", "Wǒmen dōu xué Zhōngwén!", "Chúng mình đều học tiếng Trung!"]], "9": [["A", "你好！我叫偉康。你叫什麼名字？", "Nǐ hǎo! Wǒ jiào Wěikāng. Nǐ jiào shénme míngzi?", "Xin chào! Mình tên Vỹ Khang. Bạn tên gì?"], ["B", "我叫黃龍。你今年幾歲？", "Wǒ jiào Huáng Lóng. Nǐ jīnnián jǐ suì?", "Mình tên Hoàng Long. Năm nay bạn mấy tuổi?"], ["A", "我十二歲。你家有幾口人？", "Wǒ shí'èr suì. Nǐ jiā yǒu jǐ kǒu rén?", "Mình 12 tuổi. Nhà bạn có mấy người?"], ["B", "我家有五口人：爸爸、媽媽、哥哥、妹妹和我。", "Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, gēge, mèimei hé wǒ.", "Nhà mình có 5 người: bố, mẹ, anh trai, em gái và mình."], ["A", "你喜歡玩什麼？", "Nǐ xǐhuan wán shénme?", "Bạn thích chơi gì?"], ["B", "我喜歡打球。你會說英文嗎？", "Wǒ xǐhuan dǎ qiú. Nǐ huì shuō Yīngwén ma?", "Mình thích chơi bóng. Bạn biết nói tiếng Anh không?"], ["A", "會一點。我們都學中文！", "Huì yìdiǎn. Wǒmen dōu xué Zhōngwén!", "Biết một chút. Chúng mình đều học tiếng Trung!"]], "10": [["A", "今天星期幾？", "Jīntiān xīngqí jǐ?", "Hôm nay thứ mấy?"], ["B", "今天星期二。明天星期三。", "Jīntiān xīngqí'èr. Míngtiān xīngqísān.", "Hôm nay thứ Ba. Ngày mai thứ Tư."], ["A", "你的生日是幾月幾號？", "Nǐ de shēngrì shì jǐ yuè jǐ hào?", "Sinh nhật bạn là ngày mấy tháng mấy?"], ["B", "我的生日是八月十號。你呢？", "Wǒ de shēngrì shì bā yuè shí hào. Nǐ ne?", "Sinh nhật mình là ngày 10 tháng 8. Còn bạn?"], ["A", "我的生日是明天！", "Wǒ de shēngrì shì míngtiān!", "Sinh nhật mình là ngày mai!"], ["B", "生日快樂！", "Shēngrì kuàilè!", "Chúc mừng sinh nhật!"]], "11": [["A", "現在幾點？", "Xiànzài jǐ diǎn?", "Bây giờ mấy giờ?"], ["B", "現在八點半。", "Xiànzài bā diǎn bàn.", "Bây giờ 8 giờ rưỡi."], ["A", "你早上幾點起床？", "Nǐ zǎoshang jǐ diǎn qǐchuáng?", "Buổi sáng bạn dậy lúc mấy giờ?"], ["B", "我早上六點起床。你呢？", "Wǒ zǎoshang liù diǎn qǐchuáng. Nǐ ne?", "Mình dậy lúc 6 giờ sáng. Còn bạn?"], ["A", "我七點十分起床。我晚上十點睡覺。", "Wǒ qī diǎn shí fēn qǐchuáng. Wǒ wǎnshang shí diǎn shuìjiào.", "Mình dậy lúc 7 giờ 10. Mình đi ngủ lúc 10 giờ tối."], ["B", "我中午十二點去學校。", "Wǒ zhōngwǔ shí'èr diǎn qù xuéxiào.", "Mình đi học lúc 12 giờ trưa."]], "12": [["A", "你住在哪裡？", "Nǐ zhù zài nǎlǐ?", "Bạn sống ở đâu?"], ["B", "我住在越南。你呢？", "Wǒ zhù zài Yuènán. Nǐ ne?", "Mình sống ở Việt Nam. Còn bạn?"], ["A", "我也住在越南。你現在在哪裡？", "Wǒ yě zhù zài Yuènán. Nǐ xiànzài zài nǎlǐ?", "Mình cũng sống ở Việt Nam. Bây giờ bạn đang ở đâu?"], ["B", "我在公園。你來這裡嗎？", "Wǒ zài gōngyuán. Nǐ lái zhèlǐ ma?", "Mình ở công viên. Bạn có đến đây không?"], ["A", "不來，我要回家。", "Bù lái, wǒ yào huí jiā.", "Không, mình phải về nhà."], ["B", "好，再見！", "Hǎo, zàijiàn!", "Được, tạm biệt!"]], "13": [["A", "你怎麼去學校？", "Nǐ zěnme qù xuéxiào?", "Bạn đi học bằng gì?"], ["B", "我騎腳踏車去學校。你呢？", "Wǒ qí jiǎotàchē qù xuéxiào. Nǐ ne?", "Mình đạp xe đi học. Còn bạn?"], ["A", "我走路去。我家很近。", "Wǒ zǒulù qù. Wǒ jiā hěn jìn.", "Mình đi bộ. Nhà mình rất gần."], ["B", "我家很遠。", "Wǒ jiā hěn yuǎn.", "Nhà mình rất xa."], ["A", "你爸爸騎機車嗎？", "Nǐ bàba qí jīchē ma?", "Bố bạn đi xe máy à?"], ["B", "不，他坐公車。", "Bù, tā zuò gōngchē.", "Không, bố mình đi xe buýt."]], "14": [["A", "你喜歡什麼顏色？", "Nǐ xǐhuan shénme yánsè?", "Bạn thích màu gì?"], ["B", "我喜歡藍色。你呢？", "Wǒ xǐhuan lánsè. Nǐ ne?", "Mình thích màu xanh dương. Còn bạn?"], ["A", "我喜歡紅色和黑色。", "Wǒ xǐhuan hóngsè hé hēisè.", "Mình thích màu đỏ và màu đen."], ["B", "你的衣服很漂亮！", "Nǐ de yīfu hěn piàoliang!", "Áo của bạn đẹp quá!"], ["A", "謝謝！這是一件新衣服。", "Xièxie! Zhè shì yí jiàn xīn yīfu.", "Cảm ơn! Đây là một cái áo mới."], ["B", "我今天穿白色的衣服。", "Wǒ jīntiān chuān báisè de yīfu.", "Hôm nay mình mặc áo màu trắng."]], "15": [["A", "你好！你要買什麼東西？", "Nǐ hǎo! Nǐ yào mǎi shénme dōngxi?", "Chào bạn! Bạn muốn mua gì?"], ["B", "我想買麵包。這個多少錢？", "Wǒ xiǎng mǎi miànbāo. Zhège duōshǎo qián?", "Mình muốn mua bánh mì. Cái này bao nhiêu tiền?"], ["A", "一百塊。", "Yìbǎi kuài.", "100 đồng."], ["B", "太貴了！", "Tài guì le!", "Đắt quá!"], ["A", "這個很便宜，五十塊。", "Zhège hěn piányi, wǔshí kuài.", "Cái này rẻ lắm, 50 đồng."], ["B", "好，我買這個。謝謝！", "Hǎo, wǒ mǎi zhège. Xièxie!", "Được, mình mua cái này. Cảm ơn!"]], "16": [["A", "黃龍，今天星期幾？", "Huáng Lóng, jīntiān xīngqí jǐ?", "Hoàng Long, hôm nay thứ mấy?"], ["B", "今天星期一。現在八點，我要去學校。", "Jīntiān xīngqíyī. Xiànzài bā diǎn, wǒ yào qù xuéxiào.", "Hôm nay thứ Hai. Bây giờ 8 giờ, mình phải đi học."], ["A", "你怎麼去學校？", "Nǐ zěnme qù xuéxiào?", "Bạn đi học bằng gì?"], ["B", "我坐公車去。你住在哪裡？", "Wǒ zuò gōngchē qù. Nǐ zhù zài nǎlǐ?", "Mình đi xe buýt. Bạn sống ở đâu?"], ["A", "我家在學校那裡，我走路去。", "Wǒ jiā zài xuéxiào nàlǐ, wǒ zǒulù qù.", "Nhà mình ở chỗ trường học, mình đi bộ."], ["B", "你今天穿什麼顏色的衣服？", "Nǐ jīntiān chuān shénme yánsè de yīfu?", "Hôm nay bạn mặc áo màu gì?"], ["A", "我穿藍色的衣服。這件衣服很便宜，一百塊。", "Wǒ chuān lánsè de yīfu. Zhè jiàn yīfu hěn piányi, yìbǎi kuài.", "Mình mặc áo xanh dương. Cái áo này rẻ lắm, 100 đồng."]], "17": [["A", "今天天氣怎麼樣？", "Jīntiān tiānqì zěnmeyàng?", "Thời tiết hôm nay thế nào?"], ["B", "今天有點冷。", "Jīntiān yǒudiǎn lěng.", "Hôm nay hơi lạnh."], ["A", "明天呢？", "Míngtiān ne?", "Còn ngày mai?"], ["B", "明天下雨。你要帶傘！", "Míngtiān xiàyǔ. Nǐ yào dài sǎn!", "Ngày mai mưa. Bạn phải mang ô nhé!"], ["A", "好，我也要穿外套。", "Hǎo, wǒ yě yào chuān wàitào.", "Được, mình cũng sẽ mặc áo khoác."], ["B", "我喜歡晴天，不喜歡下雨。", "Wǒ xǐhuan qíngtiān, bù xǐhuan xiàyǔ.", "Mình thích trời nắng, không thích mưa."]], "18": [["A", "你怎麼了？", "Nǐ zěnme le?", "Bạn bị sao vậy?"], ["B", "我頭痛，有點不舒服。", "Wǒ tóu tòng, yǒudiǎn bù shūfu.", "Mình đau đầu, hơi khó chịu."], ["A", "你生病了嗎？要去看醫生嗎？", "Nǐ shēngbìng le ma? Yào qù kàn yīshēng ma?", "Bạn bị ốm à? Có cần đi khám bác sĩ không?"], ["B", "不要，我想休息。", "Bú yào, wǒ xiǎng xiūxi.", "Không cần, mình muốn nghỉ ngơi."], ["A", "你要吃藥嗎？", "Nǐ yào chī yào ma?", "Bạn có muốn uống thuốc không?"], ["B", "好，謝謝。我很累。", "Hǎo, xièxie. Wǒ hěn lèi.", "Ừ, cảm ơn. Mình mệt lắm."]], "19": [["A", "你家有養動物嗎？", "Nǐ jiā yǒu yǎng dòngwù ma?", "Nhà bạn có nuôi con vật không?"], ["B", "有，我養一隻貓。你呢？", "Yǒu, wǒ yǎng yì zhī māo. Nǐ ne?", "Có, mình nuôi một con mèo. Còn bạn?"], ["A", "我養兩條魚和一隻小鳥。", "Wǒ yǎng liǎng tiáo yú hé yì zhī xiǎo niǎo.", "Mình nuôi hai con cá và một con chim nhỏ."], ["B", "你喜歡狗嗎？", "Nǐ xǐhuan gǒu ma?", "Bạn thích chó không?"], ["A", "喜歡！小狗很可愛。", "Xǐhuan! Xiǎo gǒu hěn kě'ài.", "Thích! Chó con rất dễ thương."]], "20": [["A", "我的手機在哪裡？", "Wǒ de shǒujī zài nǎlǐ?", "Điện thoại của mình đâu rồi?"], ["B", "在桌子上面嗎？", "Zài zhuōzi shàngmiàn ma?", "Ở trên bàn à?"], ["A", "不在。", "Bú zài.", "Không có."], ["B", "在床下面嗎？", "Zài chuáng xiàmiàn ma?", "Ở dưới giường à?"], ["A", "也不在。", "Yě bú zài.", "Cũng không có."], ["B", "在這裡！在椅子旁邊。", "Zài zhèlǐ! Zài yǐzi pángbiān.", "Đây rồi! Ở bên cạnh cái ghế."], ["A", "謝謝你！", "Xièxie nǐ!", "Cảm ơn bạn!"]], "21": [["A", "黃龍，你在做什麼？", "Huáng Lóng, nǐ zài zuò shénme?", "Hoàng Long, bạn đang làm gì đó?"], ["B", "我正在做功課。你呢？", "Wǒ zhèngzài zuò gōngkè. Nǐ ne?", "Mình đang làm bài tập. Còn bạn?"], ["A", "我在看電視。我們一起去游泳，好嗎？", "Wǒ zài kàn diànshì. Wǒmen yìqǐ qù yóuyǒng, hǎo ma?", "Mình đang xem tivi. Chúng mình cùng đi bơi nhé?"], ["B", "好！我等你。", "Hǎo! Wǒ děng nǐ.", "Được! Mình đợi bạn."], ["A", "你也喜歡跑步嗎？", "Nǐ yě xǐhuan pǎobù ma?", "Bạn cũng thích chạy bộ à?"], ["B", "不喜歡。我喜歡唱歌和跳舞。", "Bù xǐhuan. Wǒ xǐhuan chànggē hé tiàowǔ.", "Không thích. Mình thích hát và nhảy."]], "22": [["A", "週末你做什麼了？", "Zhōumò nǐ zuò shénme le?", "Cuối tuần bạn đã làm gì?"], ["B", "我跟爸爸看電影了。", "Wǒ gēn bàba kàn diànyǐng le.", "Mình đi xem phim với bố."], ["A", "電影好看嗎？", "Diànyǐng hǎokàn ma?", "Phim có hay không?"], ["B", "很好看，很有意思！你看過嗎？", "Hěn hǎokàn, hěn yǒu yìsi! Nǐ kàn guo ma?", "Hay lắm, rất thú vị! Bạn xem chưa?"], ["A", "還沒。你看了幾次？", "Hái méi. Nǐ kàn le jǐ cì?", "Chưa. Bạn đã xem mấy lần?"], ["B", "兩次！", "Liǎng cì!", "Hai lần!"]], "23": [["A", "黃龍，今天天氣怎麼樣？", "Huáng Lóng, jīntiān tiānqì zěnmeyàng?", "Hoàng Long, hôm nay thời tiết thế nào?"], ["B", "今天有點冷。你在做什麼？", "Jīntiān yǒudiǎn lěng. Nǐ zài zuò shénme?", "Hôm nay hơi lạnh. Bạn đang làm gì?"], ["A", "我正在找我的手機。", "Wǒ zhèngzài zhǎo wǒ de shǒujī.", "Mình đang tìm điện thoại."], ["B", "在你的桌子上面嗎？", "Zài nǐ de zhuōzi shàngmiàn ma?", "Ở trên bàn của bạn à?"], ["A", "在！謝謝。週末你做什麼了？", "Zài! Xièxie. Zhōumò nǐ zuò shénme le?", "Có rồi! Cảm ơn. Cuối tuần bạn đã làm gì?"], ["B", "我跟媽媽去醫院了。我生病了。", "Wǒ gēn māma qù yīyuàn le. Wǒ shēngbìng le.", "Mình đi bệnh viện với mẹ. Mình bị ốm."], ["A", "你現在舒服嗎？", "Nǐ xiànzài shūfu ma?", "Bây giờ bạn khỏe chưa?"], ["B", "我已經好了。我想跟你一起去游泳！", "Wǒ yǐjīng hǎo le. Wǒ xiǎng gēn nǐ yìqǐ qù yóuyǒng!", "Mình khỏe rồi. Mình muốn đi bơi cùng bạn!"]], "24": [["A", "你比你哥哥高嗎？", "Nǐ bǐ nǐ gēge gāo ma?", "Bạn cao hơn anh trai bạn không?"], ["B", "不，我哥哥比我高。", "Bù, wǒ gēge bǐ wǒ gāo.", "Không, anh trai mình cao hơn mình."], ["A", "你家誰最高？", "Nǐ jiā shéi zuì gāo?", "Nhà bạn ai cao nhất?"], ["B", "我爸爸最高。你呢？", "Wǒ bàba zuì gāo. Nǐ ne?", "Bố mình cao nhất. Còn bạn?"], ["A", "我和我弟弟一樣高。", "Wǒ hé wǒ dìdi yíyàng gāo.", "Mình và em trai mình cao bằng nhau."], ["B", "我跑步比我哥哥快！", "Wǒ pǎobù bǐ wǒ gēge kuài!", "Mình chạy nhanh hơn anh trai mình!"]], "25": [["A", "你爸爸做什麼工作？", "Nǐ bàba zuò shénme gōngzuò?", "Bố bạn làm nghề gì?"], ["B", "他是工程師。你長大以後想當什麼？", "Tā shì gōngchéngshī. Nǐ zhǎngdà yǐhòu xiǎng dāng shénme?", "Bố mình là kỹ sư. Lớn lên bạn muốn làm gì?"], ["A", "我想當醫生。", "Wǒ xiǎng dāng yīshēng.", "Mình muốn làm bác sĩ."], ["B", "為什麼？", "Wèishénme?", "Tại sao?"], ["A", "因為醫生很有意思。你呢？", "Yīnwèi yīshēng hěn yǒu yìsi. Nǐ ne?", "Vì bác sĩ rất thú vị. Còn bạn?"], ["B", "我喜歡車，所以我想當司機！", "Wǒ xǐhuan chē, suǒyǐ wǒ xiǎng dāng sījī!", "Mình thích xe, nên mình muốn làm tài xế!"]], "26": [["A", "你星期六有空嗎？", "Nǐ xīngqíliù yǒukòng ma?", "Thứ Bảy bạn rảnh không?"], ["B", "有空。", "Yǒukòng.", "Rảnh."], ["A", "我們一起去公園吧！", "Wǒmen yìqǐ qù gōngyuán ba!", "Chúng mình cùng đi công viên nhé!"], ["B", "好！我們幾點見面？", "Hǎo! Wǒmen jǐ diǎn jiànmiàn?", "Được! Mấy giờ chúng mình gặp nhau?"], ["A", "下午兩點，可以嗎？", "Xiàwǔ liǎng diǎn, kěyǐ ma?", "2 giờ chiều, được không?"], ["B", "沒問題！", "Méi wèntí!", "Không thành vấn đề!"]], "27": [["A", "喂，你好！請問黃龍在嗎？", "Wéi, nǐ hǎo! Qǐngwèn Huáng Lóng zài ma?", "Alô, xin chào! Xin hỏi Hoàng Long có ở đó không?"], ["B", "我是黃龍。你是誰？", "Wǒ shì Huáng Lóng. Nǐ shì shéi?", "Mình là Hoàng Long. Bạn là ai?"], ["A", "我是偉康！", "Wǒ shì Wěikāng!", "Mình là Vỹ Khang!"], ["B", "對不起，我聽不清楚。請你再說一次。", "Duìbuqǐ, wǒ tīng bu qīngchu. Qǐng nǐ zài shuō yí cì.", "Xin lỗi, mình nghe không rõ. Bạn nói lại lần nữa nhé."], ["A", "我是偉康！你知道我的電話號碼嗎？", "Wǒ shì Wěikāng! Nǐ zhīdào wǒ de diànhuà hàomǎ ma?", "Mình là Vỹ Khang! Bạn biết số điện thoại của mình không?"], ["B", "知道！請你大聲一點。", "Zhīdào! Qǐng nǐ dàshēng yìdiǎn.", "Biết! Bạn nói to lên một chút nhé."]], "28": [["A", "你今天開心嗎？", "Nǐ jīntiān kāixīn ma?", "Hôm nay bạn vui không?"], ["B", "非常開心！今天是我的生日。", "Fēicháng kāixīn! Jīntiān shì wǒ de shēngrì.", "Vui lắm! Hôm nay là sinh nhật mình."], ["A", "生日快樂！我也很高興。", "Shēngrì kuàilè! Wǒ yě hěn gāoxìng.", "Chúc mừng sinh nhật! Mình cũng rất vui."], ["B", "你為什麼笑？", "Nǐ wèishénme xiào?", "Sao bạn cười?"], ["A", "因為我覺得你很有意思！", "Yīnwèi wǒ juéde nǐ hěn yǒu yìsi!", "Vì mình thấy bạn rất thú vị!"], ["B", "我妹妹生氣了，她在哭。", "Wǒ mèimei shēngqì le, tā zài kū.", "Em gái mình giận rồi, nó đang khóc."]], "29": [["A", "放假你打算做什麼？", "Fàngjià nǐ dǎsuàn zuò shénme?", "Kỳ nghỉ bạn dự định làm gì?"], ["B", "我打算去海邊旅行。你呢？", "Wǒ dǎsuàn qù hǎibiān lǚxíng. Nǐ ne?", "Mình định đi biển du lịch. Còn bạn?"], ["A", "我要去外婆家。", "Wǒ yào qù wàipó jiā.", "Mình sẽ đến nhà bà ngoại."], ["B", "你外婆住在哪裡？", "Nǐ wàipó zhù zài nǎlǐ?", "Bà ngoại bạn sống ở đâu?"], ["A", "她住在一個很漂亮的地方。", "Tā zhù zài yí ge hěn piàoliang de dìfang.", "Bà sống ở một nơi rất đẹp."], ["B", "下個月我要去爺爺奶奶家！", "Xiàge yuè wǒ yào qù yéye nǎinai jiā!", "Tháng sau mình sẽ đến nhà ông bà nội!"]], "30": [["A", "喂，黃龍！你現在有空嗎？", "Wéi, Huáng Lóng! Nǐ xiànzài yǒukòng ma?", "Alô, Hoàng Long! Bây giờ bạn rảnh không?"], ["B", "有空。偉康，你在做什麼？", "Yǒukòng. Wěikāng, nǐ zài zuò shénme?", "Rảnh. Vỹ Khang, bạn đang làm gì?"], ["A", "我在家做功課。下個星期六我們一起去海邊吧！", "Wǒ zài jiā zuò gōngkè. Xiàge xīngqíliù wǒmen yìqǐ qù hǎibiān ba!", "Mình đang làm bài ở nhà. Thứ Bảy tuần sau chúng mình cùng đi biển nhé!"], ["B", "好！我們怎麼去？", "Hǎo! Wǒmen zěnme qù?", "Được! Chúng mình đi bằng gì?"], ["A", "坐公車去。下午兩點見面，可以嗎？", "Zuò gōngchē qù. Xiàwǔ liǎng diǎn jiànmiàn, kěyǐ ma?", "Đi xe buýt. 2 giờ chiều gặp nhau, được không?"], ["B", "沒問題！天氣很熱，我要帶水。", "Méi wèntí! Tiānqì hěn rè, wǒ yào dài shuǐ.", "Không vấn đề! Trời nóng, mình sẽ mang nước."], ["A", "我覺得我們會很開心！", "Wǒ juéde wǒmen huì hěn kāixīn!", "Mình thấy chúng mình sẽ rất vui!"], ["B", "我也覺得！再見！", "Wǒ yě juéde! Zàijiàn!", "Mình cũng thấy vậy! Tạm biệt!"]]}, "GRAM": [{"title": "Hỏi – đáp tuổi", "f": "A/S 今年/T 幾/Q 歲/O", "vn": "Hỏi: <b>你今年幾歲？</b> → Đáp: <b>我今年十二歲。</b><br>Nói tuổi <b>không cần 是</b>. Số đếm: 十二 = 10+2 · 二十 = 2×10.", "ex": [["你/S 今年/T 幾/Q 歲/O", "？", "Nǐ jīnnián jǐ suì?", "Năm nay bạn mấy tuổi?"], ["我/S 今年/T 十二/M 歲/O", "。", "Wǒ jīnnián shí'èr suì.", "Năm nay tôi 12 tuổi."]], "err": [["我是十二歲。", "我十二歲。", "Nói tuổi không cần 是"], ["我歲十二。", "我十二歲。", "Số đứng trước 歲"]], "pick": [["Năm nay tôi 12 tuổi.", "我今年十二歲。", "我今年歲十二。", "我是今年十二歲。"], ["Bạn mấy tuổi?", "你幾歲？", "你歲幾？", "幾你歲？"]], "build": [["你今年幾歲？", "Trả lời: Năm nay tôi 11 tuổi.", "我/S 今年/T 十一/M 歲/O", "。"]], "day": 3, "n": "B3"}, {"title": "有 / 沒有 — có / không có", "f": "A/S 有/V 兩/M 個/L 朋友/O", "vn": "Hỏi: <b>你有…嗎？</b> → Đáp: <b>有</b> / <b>沒有</b>.<br>Phủ định của 有 là <b>沒有</b> (không nói 不有).<br>Đếm 'hai' trước lượng từ dùng <b>兩</b>: 兩個 (không nói 二個).", "ex": [["你/S 家/O 有/V 幾/Q 口/L 人/O", "？", "Nǐ jiā yǒu jǐ kǒu rén?", "Nhà bạn có mấy người?"], ["我/S 有/V 兩/M 個/L 朋友/O", "。", "Wǒ yǒu liǎng ge péngyou.", "Tôi có hai người bạn."]], "err": [["我不有朋友。", "我沒有朋友。", "Phủ định của 有 là 沒有"], ["我有二個朋友。", "我有兩個朋友。", "Đếm 2 dùng 兩"], ["我有朋友兩個。", "我有兩個朋友。", "Số + lượng từ đứng trước danh từ"]], "pick": [["Tôi không có bạn Đài Loan.", "我沒有台灣朋友。", "我不有台灣朋友。", "我有沒台灣朋友。"], ["Tôi có hai người bạn.", "我有兩個朋友。", "我有二個朋友。", "我有朋友兩個。"]], "build": [["你家有幾口人？", "Trả lời: Nhà tôi có 4 người.", "我/S 家/O 有/V 四/M 口/L 人/O", "。"]], "day": 4, "n": "B4"}, {"title": "這是誰？— 我的… (của tôi)", "f": "這/S 是/V 我/M 的/P 媽媽/O", "vn": "Hỏi: <b>這是誰？</b> → Đáp: <b>這是我的媽媽。</b><br>的 = của, nhưng <b>ngược tiếng Việt</b>: mẹ CỦA TÔI → 我的媽媽. Với người thân có thể bỏ 的: 我媽媽.", "ex": [["這/S 是/V 誰/Q", "？", "Zhè shì shéi?", "Đây là ai?"], ["這/S 是/V 我/M 的/P 媽媽/O", "。", "Zhè shì wǒ de māma.", "Đây là mẹ tôi."]], "err": [["這是媽媽的我。", "這是我的媽媽。", "Người sở hữu đứng trước 的"], ["那是哥哥我。", "那是我哥哥。", "我 đứng trước 哥哥"]], "pick": [["Đây là bố tôi.", "這是我的爸爸。", "這是爸爸的我。", "這是的我爸爸。"], ["Kia là em gái bạn phải không?", "那是你的妹妹嗎？", "那是妹妹你的嗎？", "那嗎是你的妹妹？"]], "build": [["這是誰？", "Trả lời: Đây là chị gái tôi.", "這/S 是/V 我/M 的/P 姐姐/O", "。"]], "day": 5, "n": "B5"}, {"title": "喜歡 + làm gì", "f": "A/S 喜歡/V 看/V 書/O", "vn": "Hỏi: <b>你喜歡玩什麼？</b> / <b>你喜歡…嗎？</b> → Đáp: <b>我喜歡…</b> / <b>不喜歡</b>.<br>喜歡 + động từ + vật. Phủ định dùng <b>不</b>.", "ex": [["你/S 喜歡/V 玩/V 什麼/Q", "？", "Nǐ xǐhuan wán shénme?", "Bạn thích chơi gì?"], ["我/S 喜歡/V 聽/V 音樂/O", "。", "Wǒ xǐhuan tīng yīnyuè.", "Tôi thích nghe nhạc."]], "err": [["我喜歡書看。", "我喜歡看書。", "Động từ đứng trước vật"], ["我沒喜歡打球。", "我不喜歡打球。", "Phủ định 喜歡 dùng 不"]], "pick": [["Tôi thích nghe nhạc.", "我喜歡聽音樂。", "我喜歡音樂聽。", "我聽喜歡音樂。"], ["Bạn có thích xem tivi không?", "你喜歡看電視嗎？", "你看電視喜歡嗎？", "你喜歡嗎看電視？"]], "build": [["你喜歡打球嗎？", "Trả lời: Tôi không thích chơi bóng.", "我/S 不/A 喜歡/V 打/V 球/O", "。"]], "day": 6, "n": "B6"}, {"title": "想 / 要 + làm gì", "f": "A/S 想/A 吃/V 麵包/O", "vn": "Hỏi: <b>你想吃什麼？</b> → Đáp: <b>我想吃…</b><br>想 = muốn · 要 = muốn/cần (mạnh hơn). Đứng <b>trước động từ</b>. Phủ định: 不想 / 不要.", "ex": [["你/S 想/A 喝/V 什麼/Q", "？", "Nǐ xiǎng hē shénme?", "Bạn muốn uống gì?"], ["我/S 想/A 喝/V 牛奶/O", "。", "Wǒ xiǎng hē niúnǎi.", "Tôi muốn uống sữa."]], "err": [["我吃想麵包。", "我想吃麵包。", "想 đứng trước động từ"], ["你要茶喝嗎？", "你要喝茶嗎？", "Động từ đứng trước vật"]], "pick": [["Tôi muốn uống sữa.", "我想喝牛奶。", "我喝想牛奶。", "我想牛奶喝。"], ["Bạn muốn ăn gì?", "你想吃什麼？", "你吃想什麼？", "什麼你想吃？"]], "build": [["你想喝什麼？", "Trả lời: Tôi muốn uống trà.", "我/S 想/A 喝/V 茶/O", "。"]], "day": 7, "n": "B7"}, {"title": "會 + làm gì (biết làm)", "f": "A/S 會/A 說/V 中文/O", "vn": "Hỏi: <b>你會…嗎？</b> → Đáp ngắn: <b>會</b> / <b>不會</b> (bú huì).<br>會 đứng <b>trước động từ</b>. Thêm 一點 = một chút: 會說一點中文.", "ex": [[ function fcShow(){
 if(!fc.q.length){app.innerHTML=head("studyMenu()")+`<div class="card"><div class="mid">🎉</div><p class="vn">Em đã nhớ hết ${fc.total} chữ!</p></div><button class="btn" onclick="fcStart()">Học lại</button><button class="btn sec" onclick="studyMenu()">Về menu</button>`;return}

 app.innerHTML=head("studyMenu()")+`<div class="top"><span>Đã nhớ ${fc.done}/${fc.total}</span><span>Chạm thẻ để lật</span></div>

  ${fc.flip?`<div class="py">${w.p}</div><div class="vn">${esc(w.m)}</div><div class="ex">${w.e}</div><div class="exs">${w.ep}<br>${w.ev}</div>`:`<div class="hint">Đọc to chữ này, nhớ nghĩa, rồi chạm để kiểm tra</div>`}
 </div>
 ${canSpeak()?`<button class="spk" onclick="speak('${w.c}')">🔊</button>`:""}
 ${fc.flip?`<div class="row"><button class="btn sec" onclick="fcAns(0)">✗ Chưa nhớ</button><button class="btn" onclick="fcAns(1)">✓ Nhớ rồi</button></div>`:""}`}
function fcAns(ok){logAct('card',0);const w=fc.q.shift();fc.flip=false;if(ok)fc.done++;else fc.q.splice(Math.min(3,fc.q.length),0,w);fcShow()}

let qz={};
function mkQ(w,src,dir){const others=shuf(src.filter(x=>x.c!==w.c&&x.m!==w.m)).slice(0,3);return {w,dir,opts:shuf([w,...others])}}
function qzStart(){const P=pool(scope),src=P.length>=4?P:WORDS;const n=Math.min(10,P.length);
 qz={qs:shuf(P).slice(0,n).map(w=>mkQ(w,src,Math.random()<.6?"c2m":"m2c")),i:0,ok:0,ans:null};qzShow()}
function qHTML(q,ans,fn){const w=q.w;
 const prompt=q.dir==="c2m"?`<div class="hint">Chữ này nghĩa là gì?</div><div class="big" style="font-size:72px">${w.c}</div>`:`<div class="hint">Chọn chữ Hán đúng:</div><div class="vn" style="font-size:26px;margin:18px 0">${esc(w.m)}</div>`;
 const opts=q.opts.map((o,k)=>{let cl="opt"+(q.dir==="m2c"?" zh":"");if(ans!==null){if(o.c===w.c)cl+=" ok";else if(k===ans)cl+=" bad"}
  return `<button class="${cl}" ${ans!==null?"disabled":""} onclick="${fn}(${k})">${q.dir==="c2m"?esc(o.m):o.c}</button>`}).join("");
 return `<div class="card">${prompt}<div class="opts">${opts}</div></div>`}
function qzShow(){
 if(qz.i>=qz.qs.length){app.innerHTML=head("studyMenu()")+`<div class="card"><div class="score">${qz.ok}/${qz.qs.length}</div><p class="vn">${qz.ok==qz.qs.length?"Xuất sắc! 🎉":"Làm lại để nhớ chắc hơn nhé!"}</p></div><button class="btn" onclick="qzStart()">Làm lượt mới</button><button class="btn sec" onclick="studyMenu()">Về menu</button>`;return}
 const q=qz.qs[qz.i],w=q.w;
 app.innerHTML=head("studyMenu()")+`<div class="top"><span>Câu ${qz.i+1}/${qz.qs.length}</span><span>Đúng: ${qz.ok}</span></div><div class="bar"><i style="width:${qz.i/qz.qs.length*100}%"></i></div>`+
 qHTML(q,qz.ans,"qzAns")+(qz.ans!==null?`<div class="fb ${q.opts[qz.ans].c===w.c?"ok":"bad"}">${q.opts[qz.ans].c===w.c?"Đúng rồi!":"Chưa đúng"} · ${w.c} ${w.p} = ${esc(w.m)}</div>${canSpeak()?`<button class="spk" onclick="speak('${w.c}')">🔊</button>`:""}<button class="btn" onclick="qz.i++;qz.ans=null;qzShow()">Tiếp →</button>`:"")}
function qzAns(k){if(qz.ans!==null)return;qz.ans=k;const _o=qz.qs[qz.i].opts[k].c===qz.qs[qz.i].w.c;logAct('quiz',_o);if(_o)qz.ok++;qzShow()}

/* ---------- Sắp xếp câu ---------- */
let ar={};
function arPrep(s){let pile=shuf(s.t.map((t,i)=>({t,i})));let g=0;while(s.t.length>1&&pile.map(x=>x.t).join("")===s.t.join("")&&g++<10)pile=shuf(pile);return {s,pile,picked:[],checked:null}}
function arStart(){const S=spool(scope);ar={qs:shuf(S).map(arPrep),i:0,ok:0};arShow()}
function arHTML(st,fnPick,fnUn){
 return `<div class="card"><div class="hint">Sắp xếp thành câu:</div><div class="vn" style="margin:6px 0 12px">“${esc(st.s.vn)}”</div>
 <div class="tiles ans">${st.picked.map((x,k)=>`<button class="tile" onclick="${fnUn}(${k})">${x.t}</button>`).join("")||'<span class="hint" style="align-self:center">Chạm các ô bên dưới theo đúng thứ tự</span>'}</div>
 <div class="tiles">${st.pile.map((x,k)=>`<button class="tile" onclick="${fnPick}(${k})">${x.t}</button>`).join("")}</div></div>`}
function arShow(){
 if(ar.i>=ar.qs.length){app.innerHTML=head("studyMenu()")+`<div class="card"><div class="score">${ar.ok}/${ar.qs.length}</div><p class="vn">câu đúng ngay lần đầu</p></div><button class="btn" onclick="arStart()">Làm lại</button><button class="btn sec" onclick="studyMenu()">Về menu</button>`;return}
 const st=ar.qs[ar.i];const full=st.pile.length===0;
 let fb="";if(st.checked!==null){const right=st.s.t.join("")+st.s.end;fb=`<div class="fb ${st.checked?"ok":"bad"}">${st.checked?"Đúng rồi! 🎉":"Chưa đúng. Đáp án:"} ${right}</div>${canSpeak()?`<button class="spk" onclick="speak('${st.s.t.join("")}')">🔊</button>`:""}`}
 app.innerHTML=head("studyMenu()")+`<div class="top"><span>Câu ${ar.i+1}/${ar.qs.length}</span><span>Đúng: ${ar.ok}</span></div><div class="bar"><i style="width:${ar.i/ar.qs.length*100}%"></i></div>`+
 arHTML(st,"arPick","arUn")+fb+(st.checked===null?`<button class="btn" ${full?"":"disabled"} onclick="arCheck()">Kiểm tra</button>`:`<button class="btn" onclick="ar.i++;arShow()">Tiếp →</button>`)}
function arPick(k){const st=ar.qs[ar.i];if(st.checked!==null)return;st.picked.push(st.pile.splice(k,1)[0]);arShow()}
function arUn(k){const st=ar.qs[ar.i];if(st.checked!==null)return;st.pile.push(st.picked.splice(k,1)[0]);arShow()}
function arCheck(){const st=ar.qs[ar.i];st.checked=st.picked.map(x=>x.t).join("")===st.s.t.join("");logAct('ar',st.checked);if(st.checked)ar.ok++;arShow()}

let T={};
function testGate(err){stopT();
 app.innerHTML=head("home()")+`<div class="card"><p class="vn">Nhập mã bài kiểm tra</p><p class="hint">Thầy sẽ gửi mã qua Zalo khi đến giờ kiểm tra.</p>
 <input class="code" id="code" autocomplete="off" placeholder="VD: B2-XXXX"><div class="err">${err||""}</div>
 <button class="btn" onclick="codeGo()">Mở bài</button></div>`}
function codeGo(){const raw=$("#code").value.trim().toUpperCase();const cfg=CODES[hash(raw)];if(!cfg)return testGate("Mã không đúng. Hỏi lại thầy nhé.");testIntro(raw,cfg)}
function testIntro(code,cfg){
 const key="att:"+me+":"+code;const prev=+(store.get(key)||0);
 app.innerHTML=head("home()")+`<div class="card"><h2 style="color:var(--red);text-align:center;margin:0">Kiểm tra buổi ${cfg.buoi}</h2>
 <div class="meta"><b>Học sinh</b><span>${esc(me)}</span><b>Nội dung</b><span>${esc(EXT.THEMES[cfg.buoi]||"")} · cộng dồn buổi 1–${cfg.maxDay} (${WORDS.filter(w=>w.day<=cfg.maxDay).length} từ)</span>
 <b>Số câu</b><span>${cfg.nVocab} từ vựng + ${cfg.nQA} hỏi–đáp + ${cfg.nGram} ngữ pháp + ${cfg.nSent} sắp xếp câu</span><b>Thời gian</b><span>${cfg.secV}s từ vựng · ${cfg.secQ}s hỏi–đáp · ${cfg.secG}s ngữ pháp · ${cfg.secS}s sắp xếp</span></div>
 <p class="hint" style="text-align:left;margin-top:12px">⚠ Không có gợi ý pinyin.<br>⚠ Không quay lại câu trước được.<br>⚠ Hết giờ thì câu đó tính sai.<br>⚠ Làm xong, <b>chụp màn hình kết quả gửi thầy qua Zalo</b>.</p>
 ${prev?`<div class="fb bad">Em đã bắt đầu bài này ${prev} lần. Lần làm sẽ hiện trên kết quả.</div>`:""}</div>
 <button class="btn" onclick="testStart('${code}')">Bắt đầu</button>`}
function testStart(code){const cfg=CODES[hash(code)];const key="att:"+me+":"+code;const att=+(store.get(key)||0)+1;store.set(key,att);
 const P=WORDS.filter(w=>w.day<=cfg.maxDay),S=SENTS.filter(s=>s.day<=cfg.maxDay);
 // ưu tiên: bao phủ từ mới của buổi hiện tại + từ cũ
 const cur=daysOf(cfg.maxDay);const newW=shuf(P.filter(w=>cur.includes(w.day))),oldW=shuf(P.filter(w=>!cur.includes(w.day)));
 const nNew=Math.min(newW.length,Math.ceil(cfg.nVocab/2));const pickW=shuf([...newW.slice(0,nNew),...oldW.slice(0,cfg.nVocab-nNew)]);
 const vq=pickW.map((w,i)=>({type:"v",...mkQ(w,P,i%3===2?"m2c":"c2m"),ans:null}));
 const sq=shuf(S).slice(0,cfg.nSent).map(s=>({type:"s",...arPrep(s)}));
 const GP=gPicks(cfg.maxDay),gNew=shuf(GP.filter(x=>cur.includes(x.g.day))),gOld=shuf(GP.filter(x=>!cur.includes(x.g.day)));
 const gq=[...gNew.slice(0,3),...gOld].slice(0,cfg.nGram).map(x=>({type:"g",...x}));
 const QP=EXT.QA.filter(x=>x.day<=cfg.maxDay),qNew=shuf(QP.filter(x=>cur.includes(x.day))),qOld=shuf(QP.filter(x=>!cur.includes(x.day)));
 const seenQ=new Set();const qq=[...qNew.slice(0,3),...qOld,...qNew.slice(3)].filter(x=>!seenQ.has(x.q)&&seenQ.add(x.q)).slice(0,cfg.nQA).map(x=>{const wr=[];shuf(QP.filter(y=>y.k!==x.k&&y.a!==x.a)).forEach(y=>{if(wr.length<2&&!wr.includes(y.a))wr.push(y.a)});return {type:"q",x,right:x.a,opts:shuf([x.a,...wr])}});
 T={code,cfg,att,qs:[...vq,...qq,...gq,...sq],i:0,start:Date.now(),wrong:[]};tShow()}
function tShow(){stopT();
 if(T.i>=T.qs.length)return tResult();
 const q=T.qs[T.i];const sec=q.type==="v"?T.cfg.secV:q.type==="q"?T.cfg.secQ:q.type==="g"?T.cfg.secG:T.cfg.secS;T.left=sec;
 const top=`<div class="top"><span>Câu ${T.i+1}/${T.qs.length}</span><span id="tl">⏱ ${sec}s</span></div><div class="bar tbar"><i id="tb" style="width:100%"></i></div>`;
 if(q.type==="q") app.innerHTML=`<header><h1>Kiểm tra buổi ${T.cfg.buoi}</h1><div class="who">${esc(me)}</div></header>`+top+`<div class="card"><div class="hint">Bạn hỏi em câu này. Chọn câu TRẢ LỜI phù hợp:</div><div style="font-size:26px;text-align:center;margin:12px 0;font-weight:700">${q.x.q}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt zh" style="font-size:20px;font-weight:500" onclick="tAnsQ(${k})">${o}</button>`).join("")}</div></div>`;
 else if(q.type==="g") app.innerHTML=`<header><h1>Kiểm tra buổi ${T.cfg.buoi}</h1><div class="who">${esc(me)}</div></header>`+top+`<div class="card"><div class="hint">Chọn câu ĐÚNG ngữ pháp:</div><div class="vn" style="margin:8px 0">“${esc(q.vn)}”</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt zh" style="font-size:24px" onclick="tAnsG(${k})">${o}</button>`).join("")}</div></div>`;
 else if(q.type==="v") app.innerHTML=`<header><h1>Kiểm tra buổi ${T.cfg.buoi}</h1><div class="who">${esc(me)}</div></header>`+top+qHTML(q,null,"tAnsV");
 else app.innerHTML=`<header><h1>Kiểm tra buổi ${T.cfg.buoi}</h1><div class="who">${esc(me)}</div></header>`+top+arHTML(q,"tPick","tUn")+`<button class="btn" ${q.pile.length?"disabled":""} onclick="tAnsS()">Nộp câu này →</button>`;
 timer=setInterval(()=>{T.left--;const tl=$("#tl"),tb=$("#tb");if(tl)tl.textContent="⏱ "+T.left+"s";if(tb)tb.style.width=(T.left/sec*100)+"%";if(T.left<=0){stopT();tTimeout()}},1000)}
function tRedrawS(){const q=T.qs[T.i];const card=document.querySelector(".card");const tmp=document.createElement("div");tmp.innerHTML=arHTML(q,"tPick","tUn");card.replaceWith(tmp.firstElementChild);document.querySelector(".btn").disabled=q.pile.length>0}
function tPick(k){const q=T.qs[T.i];q.picked.push(q.pile.splice(k,1)[0]);tRedrawS()}
function tUn(k){const q=T.qs[T.i];q.pile.push(q.picked.splice(k,1)[0]);tRedrawS()}
function tAnsV(k){stopT();const q=T.qs[T.i];const ok=q.opts[k].c===q.w.c;q.ok=ok;if(!ok)T.wrong.push({kind:"v",w:q.w});T.i++;tShow()}
function tAnsQ(k){stopT();const q=T.qs[T.i];q.ok=q.opts[k]===q.right;if(!q.ok)T.wrong.push({kind:"q",q,got:q.opts[k]});T.i++;tShow()}
function tAnsG(k){stopT();const q=T.qs[T.i];q.ok=q.opts[k]===q.right;if(!q.ok)T.wrong.push({kind:"g",q,got:q.opts[k]});T.i++;tShow()}
function tAnsS(){stopT();const q=T.qs[T.i];q.ok=q.picked.map(x=>x.t).join("")===q.s.t.join("");if(!q.ok)T.wrong.push({kind:"s",s:q.s,got:q.picked.map(x=>x.t).join("")});T.i++;tShow()}
function tTimeout(){const q=T.qs[T.i];q.ok=false;q.timeout=true;if(q.type==="v")T.wrong.push({kind:"v",w:q.w,to:1});else if(q.type==="g")T.wrong.push({kind:"g",q,got:"(hết giờ)"});else if(q.type==="q")T.wrong.push({kind:"q",q,got:"(hết giờ)"});else T.wrong.push({kind:"s",s:q.s,got:"(hết giờ)"});T.i++;tShow()}
function tResult(){stopT();
 const nOk=T.qs.filter(q=>q.ok).length,total=T.qs.length,score=Math.round(nOk/total*100);
 const d=new Date(),pad=n=>String(n).padStart(2,"0");
 const when=`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
 const used=Math.round((Date.now()-T.start)/1000);
 const qw=T.wrong.filter(x=>x.kind==="q"),gw=T.wrong.filter(x=>x.kind==="g"),vw=T.wrong.filter(x=>x.kind==="v"),sw=T.wrong.filter(x=>x.kind==="s");
 app.innerHTML=`<div class="card res"><h2>Kết quả kiểm tra buổi ${T.cfg.buoi}</h2>
 <div class="score">${score}</div><div class="hint">điểm / 100 · đúng ${nOk}/${total} câu</div>
 <div class="meta"><b>Học sinh</b><span>${esc(me)}</span><b>Thời gian</b><span>${when}</span><b>Làm trong</b><span>${Math.floor(used/60)} phút ${used%60} giây</span>
 <b>Lần làm</b><span>${T.att}${T.att>1?' <span class="pill">làm lại</span>':""}</span></div></div>
 ${vw.length?`<div class="card"><b>Chữ cần ôn lại (${vw.length})</b><table class="wr">${vw.map(x=>`<tr><td class="c">${x.w.c}</td><td style="color:var(--red)">${x.w.p}</td><td>${esc(x.w.m)}${x.to?' <span class="pill">hết giờ</span>':""}</td></tr>`).join("")}</table></div>`:""}
 ${qw.length?`<div class="card"><b>Hỏi – đáp sai (${qw.length})</b><table class="wr">${qw.map(x=>`<tr><td>Hỏi: <b>${x.q.x.q}</b><br>Đáp đúng: <b>${x.q.right}</b><br><span class="hint">Em chọn: ${esc(x.got)}</span></td></tr>`).join("")}</table></div>`:""}
 ${gw.length?`<div class="card"><b>Ngữ pháp sai (${gw.length})</b><table class="wr">${gw.map(x=>`<tr><td><span class="pill">${x.q.g.n}</span> Đúng: <b>${x.q.right}</b><br><span class="hint">Em chọn: ${esc(x.got)}</span></td></tr>`).join("")}</table></div>`:""}
 ${sw.length?`<div class="card"><b>Câu sắp xếp sai (${sw.length})</b><table class="wr">${sw.map(x=>`<tr><td>Đúng: <b>${x.s.t.join("")}${x.s.end}</b><br><span class="hint">Em xếp: ${esc(x.got||"—")}</span></td></tr>`).join("")}</table></div>`:""}
 <div class="card"><b>📊 Luyện tập trước khi kiểm tra</b>${statsMini(stats())}</div>
 <div class="card" style="border:2px solid var(--red)">${callCardHTML(T.cfg.buoi)}</div>
 <p class="hint">📸 Chụp màn hình trang này gửi thầy qua Zalo.</p>
 <button class="btn sec" onclick="home()">Về trang chính</button>`;
 window.scrollTo(0,0)}

let gd={};
function gDrill(i){const set=i<0?GRAM.filter(g=>g.day<=MAXDAY):[GRAM[i]];
 let items=[];set.forEach(g=>{g.pick.forEach(p=>items.push({k:"p",g,vn:p[0],right:p[1],opts:shuf(p.slice(1)),ans:null}));
  g.build.forEach(b=>{const toks=tk(b[2]);items.push({k:"b",g,from:b[0],how:b[1],s:{t:toks.map(x=>x.t),end:b[3]},roles:toks,pile:shuf(toks.map((x,j)=>({t:x.t,r:x.r,i:j}))),picked:[],checked:null})})});
 items=i<0?shuf(items).slice(0,12):items.sort((a,b)=>a.k===b.k?0:a.k==="p"?-1:1);
 gd={items,i:0,ok:0,from:i};gShow()}
function gShow(){const back=gd.from<0?"gramMenu()":`gLesson(${gd.from})`;
 if(gd.i>=gd.items.length){app.innerHTML=head(back)+`<div class="card"><div class="score">${gd.ok}/${gd.items.length}</div><p class="vn">${gd.ok==gd.items.length?"Xuất sắc! 🎉":"Xem lại bài học rồi luyện lại nhé!"}</p></div><button class="btn" onclick="gDrill(${gd.from})">Luyện lại</button><button class="btn sec" onclick="gramMenu()">Về Ngữ pháp</button>`;return}
 const q=gd.items[gd.i];let body="";
 const top=`<div class="top"><span>${q.g.n} · Câu ${gd.i+1}/${gd.items.length}</span><span>Đúng: ${gd.ok}</span></div><div class="bar"><i style="width:${gd.i/gd.items.length*100}%"></i></div>`;
 if(q.k==="p"){
  body=`<div class="card"><div class="hint">Chọn câu ĐÚNG ngữ pháp:</div><div class="vn" style="margin:8px 0">“${esc(q.vn)}”</div><div class="opts">${q.opts.map((o,k)=>{let cl="opt zh";if(q.ans!==null){if(o===q.right)cl+=" ok";else if(k===q.ans)cl+=" bad"}return `<button class="${cl}" style="font-size:24px" ${q.ans!==null?"disabled":""} onclick="gPick(${k})">${o}</button>`}).join("")}</div></div>`;
  if(q.ans!==null){const ok=q.opts[q.ans]===q.right;const e=q.g.err.find(x=>x[0]===q.opts[q.ans]);
   body+=`<div class="fb ${ok?"ok":"bad"}">${ok?"Đúng rồi! 🎉":"Chưa đúng."}${!ok&&e&&e[2]?" "+e[2]:""}</div>${formulaHTML(q.g.f)}<button class="btn" onclick="gd.i++;gShow()">Tiếp →</button>`}
 } else {
  const tile=(x,k,fn,inAns)=>`<button class="tile" style="border-color:${ROLE[x.r][1]};color:${ROLE[x.r][1]};background:#fff" onclick="${fn}(${k})">${x.t}</button>`;
  body=`<div class="card">${q.from?`<div class="hint">Câu gốc: <span style="font-size:20px;color:#222">${q.from}</span></div>`:""}<div class="vn" style="margin:6px 0">${esc(q.how)}</div>${formulaHTML(q.g.f)}
  <div class="tiles ans">${q.picked.map((x,k)=>tile(x,k,"gUn")).join("")||'<span class="hint" style="align-self:center">Chạm các ô theo đúng thứ tự</span>'}${q.picked.length?`<span style="align-self:center;font-size:24px">${q.s.end}</span>`:""}</div>
  <div class="tiles">${q.pile.map((x,k)=>tile(x,k,"gPk")).join("")}</div></div>`;
  if(q.checked===null) body+=`<button class="btn" ${q.pile.length?"disabled":""} onclick="gCheck()">Kiểm tra</button>`;
  else body+=`<div class="fb ${q.checked?"ok":"bad"}">${q.checked?"Đúng rồi! 🎉":"Chưa đúng. Đáp án:"} <span style="font-size:20px">${tokHTML(q.roles,q.s.end)}</span></div><button class="btn" onclick="gd.i++;gShow()">Tiếp →</button>`}
 app.innerHTML=head(back)+top+body}
function gPick(k){const q=gd.items[gd.i];if(q.ans!==null)return;q.ans=k;logAct('gram',q.opts[k]===q.right);if(q.opts[k]===q.right)gd.ok++;gShow()}
function gPk(k){const q=gd.items[gd.i];if(q.checked!==null)return;q.picked.push(q.pile.splice(k,1)[0]);gShow()}
function gUn(k){const q=gd.items[gd.i];if(q.checked!==null)return;q.pile.push(q.picked.splice(k,1)[0]);gShow()}
function gCheck(){const q=gd.items[gd.i];q.checked=q.picked.map(x=>x.t).join("")===q.s.t.join("");logAct('gram',q.checked);if(q.checked)gd.ok++;gShow()}

 if(rp.i>=rp.steps.length){app.innerHTML=head(`dlgView(${rp.n})`)+`<div class="card">${shown}</div><div class="card"><div class="score">${rp.ok}/${rp.tot}</div><p class="vn">${rp.ok==rp.tot?"Tuyệt vời! Em đã thuộc vai 🎉":"Luyện lại để thuộc vai nhé!"}</p></div><button class="btn" onclick="rpStart(${rp.n},'${rp.role}')">Luyện lại</button><button class="btn sec" onclick="dlgView(${rp.n})">Về đoạn hội thoại</button>`;window.scrollTo(0,document.body.scrollHeight);return}
 const s=rp.steps[rp.i];
 if(s.l[0]!==rp.role){app.innerHTML=head(`dlgView(${rp.n})`)+`<div class="top"><span>Em đóng vai ${SPK[rp.role][0]} (${SPK[rp.role][1]})</span><span>Đúng: ${rp.ok}</span></div><div class="card">${shown}${lineHTML(s.l,0,true)}</div><button class="btn" onclick="rp.i++;rpShow()">Tiếp → (đến lượt em)</button>`;
  if(canSpeak())speak(s.l[1]);window.scrollTo(0,document.body.scrollHeight);return}
 app.innerHTML=head(`dlgView(${rp.n})`)+`<div class="top"><span>Em đóng vai ${SPK[rp.role][0]} (${SPK[rp.role][1]})</span><span>Đúng: ${rp.ok}</span></div><div class="card">${shown||'<div class="hint">Em nói câu đầu tiên</div>'}</div>
 <div class="card"><div class="hint">Lượt của em — chọn câu đúng rồi <b>đọc to</b>:</div><div class="opts">${s.opts.map((o,k)=>{let cl="opt zh";if(s.ans!==null){if(o===s.l[1])cl+=" ok";else if(k===s.ans)cl+=" bad"}return `<button class="${cl}" style="font-size:20px;font-weight:500" ${s.ans!==null?"disabled":""} onclick="rpAns(${k})">${o}</button>`}).join("")}</div>
 ${s.ans!==null?`<div class="hint" style="margin-top:8px">${s.l[2]}<br>${esc(s.l[3])}</div>${canSpeak()?`<button class="spk" onclick="speak('${s.l[1]}')">🔊</button>`:""}<button class="btn" onclick="rp.i++;rpShow()">Tiếp →</button>`:""}</div>`;window.scrollTo(0,document.body.scrollHeight)}
function rpAns(k){const s=rp.steps[rp.i];if(s.ans!==null)return;s.ans=k;const ok=s.opts[k]===s.l[1];logAct('gram',ok);if(ok)rp.ok++;rpShow()}
function callQs(n){let qs=EXT.QA.filter(q=>q.day==n);if(EXT.REVIEW.includes(n))qs=EXT.QA.filter(q=>q.day>n-7&&q.day<=n);const seen=new Set();return qs.filter(q=>!seen.has(q.q)&&seen.add(q.q)).slice(0,6)}
function callCardHTML(n){const r=myRole(),o=r==="A"?"B":"A";
 return `<div class="vn" style="color:var(--red)">📞 Gọi điện luyện nói · Buổi ${n}</div><div class="hint">${esc(EXT.THEMES[n])} · khoảng 10 phút</div>
 <ol style="padding-left:20px;font-size:15px;line-height:1.6">
 <li><b>Đọc theo vai:</b> Vỹ Khang đọc vai <b style="color:${SPK.A[2]}">偉康</b>, Hoàng Long đọc vai <b style="color:${SPK.B[2]}">黃龍</b>. Em là <b style="color:${SPK[r][2]}">${SPK[r][0]}</b> — em ${r==="A"?"nói trước":"trả lời trước"}.</li>
 <li><b>Đổi vai:</b> đọc lại một lần nữa, em đóng vai <b style="color:${SPK[o][2]}">${SPK[o][0]}</b>.</li>
 <li><b>Nói thật về mình:</b> lần lượt hỏi nhau các câu dưới đây, trả lời bằng thông tin <b>thật</b> của em (không đọc theo bài).</li></ol>
 <table class="wr">${callQs(n).map(q=>`<tr><td style="font-size:20px">${q.q}</td></tr>`).join("")}</table>
 <div class="hint" style="margin-top:6px">Không nghe rõ? Nói: 請你再說一次。· 我聽不清楚。</div>`}
function callCard(n,back){stopT();app.innerHTML=head(back||"dlgMenu()")+`<div class="card">${callCardHTML(n)}</div><button class="btn sec" onclick="dlgView(${n})">Xem đoạn hội thoại</button>`;window.scrollTo(0,0)}

/* ================== NHẬT KÝ LUYỆN TẬP (lưu trên máy) ================== */
const dkey=d=>{const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
function getLog(){try{return JSON.parse(store.get("log:"+me)||"{}")}catch(e){return {}}}
let lastAct=0;
function logAct(kind,ok){if(!me)return;const L=getLog();L.days=L.days||{};const k=dkey(new Date());
 const D=L.days[k]=L.days[k]||{sec:0,n:0,ok:0,card:0,quiz:0,ar:0,gram:0};
 const now=Date.now();const gap=(now-lastAct)/1000;D.sec+=lastAct&&gap<120?gap:10;lastAct=now;
 D.n++;if(ok)D.ok++;D[kind]=(D[kind]||0)+1;store.set("log:"+me,JSON.stringify(L))}
function stats(){const L=getLog(),days=L.days||{},ks=Object.keys(days).sort();
 let sec=0,n=0,ok=0,card=0,quiz=0,ar=0,gram=0;ks.forEach(k=>{const D=days[k];sec+=D.sec;n+=D.n;ok+=D.ok;card+=D.card||0;quiz+=D.quiz||0;ar+=D.ar||0;gram+=D.gram||0});
 let streak=0;const d=new Date();if(!days[dkey(d)])d.setDate(d.getDate()-1);while(days[dkey(d)]){streak++;d.setDate(d.getDate()-1)}
 return {days,ks,nDays:ks.length,min:Math.round(sec/60),n,ok,card,quiz,ar,gram,acc:(quiz+ar+gram)?Math.round(ok/(quiz+ar+gram)*100):0,streak,last:ks[ks.length-1]}}
const fmtD=k=>k?k.slice(8,10)+"/"+k.slice(5,7):"—";
function statsMini(s){return `<div class="meta"><b>Số ngày luyện</b><span>${s.nDays} ngày (liên tiếp: ${s.streak})</span><b>Tổng thời gian</b><span>${s.min} phút</span><b>Thẻ lật</b><span>${s.card} lượt</span><b>Câu đã làm</b><span>${s.quiz+s.ar+s.gram} câu · đúng ${s.acc}%</span><b>Luyện gần nhất</b><span>${fmtD(s.last)}</span></div>`}
function logView(){stopT();const s=stats();
 const last7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);last7.push([k,s.days[k]])}
 const mx=Math.max(1,...last7.map(x=>x[1]?x[1].sec:0));
 app.innerHTML=head("home()")+`<div class="card"><h2 style="color:var(--red);text-align:center;margin:0 0 4px">📊 Nhật ký luyện tập</h2><div class="vn">${esc(me)}</div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;text-align:center">
  <div><div class="score" style="font-size:36px">${s.nDays}</div><div class="hint">ngày luyện</div></div>
  <div><div class="score" style="font-size:36px">${s.min}</div><div class="hint">phút</div></div>
  <div><div class="score" style="font-size:36px">${s.streak}🔥</div><div class="hint">ngày liên tiếp</div></div></div>
 ${statsMini(s)}</div>
 <div class="card"><b>7 ngày gần nhất</b>
 <div style="display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:10px">${last7.map(([k,D])=>{const m=D?Math.round(D.sec/60):0;return `<div style="flex:1;text-align:center;font-size:11px;color:#888"><div style="color:#222;font-weight:600">${m||""}</div><div style="background:${D?"var(--red)":"#eee"};height:${D?Math.max(6,D.sec/mx*90):4}px;border-radius:4px 4px 0 0"></div>${fmtD(k)}</div>`}).join("")}</div>
 <div class="hint">phút luyện mỗi ngày</div></div>
 <div class="card"><b>Chi tiết theo ngày</b><table class="wr"><tr><td><b>Ngày</b></td><td><b>Phút</b></td><td><b>Thẻ</b></td><td><b>Câu</b></td><td><b>Đúng</b></td></tr>
 ${s.ks.slice().reverse().slice(0,14).map(k=>{const D=s.days[k],q=(D.quiz||0)+(D.ar||0)+(D.gram||0);return `<tr><td>${fmtD(k)}</td><td>${Math.round(D.sec/60)}</td><td>${D.card||0}</td><td>${q}</td><td>${q?Math.round(D.ok/q*100)+"%":"—"}</td></tr>`}).join("")||'<tr><td colspan="5" class="hint">Chưa luyện ngày nào</td></tr>'}</table></div>
 <p class="hint">📸 Chụp màn hình gửi thầy qua Zalo. Dữ liệu lưu trên điện thoại này.</p>
 <button class="btn sec" onclick="home()">Về trang chính</button>`;window.scrollTo(0,0)}

home();
</script>
</body>
